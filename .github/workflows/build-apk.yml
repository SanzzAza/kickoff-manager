name: Build APK

# Build otomatis setiap push ke main, atau manual dari tab Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# hindari build menumpuk bila push beruntun
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test --reporter compact

      - name: Build split APK (per ABI)
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1)
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          echo "Building $VERSION ($BUILD)"
          flutter build apk --release --split-per-abi \
            --dart-define=APP_VERSION="$VERSION" \
            --dart-define=APP_BUILD="$BUILD"

      - name: Rename outputs
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1)
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi=$(echo "$f" | sed 's/app-\(.*\)-release.apk/\1/')
            mv "$f" "KickoffManager-${VERSION}-${abi}.apk"
          done
          ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/KickoffManager-*.apk

      # Simpan APK ke Release supaya bisa diunduh lewat link tetap
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            APK otomatis dari commit ${{ github.sha }}.
            Unduh file `KickoffManager-*-arm64-v8a.apk` untuk HP Android modern.
          files: build/app/outputs/flutter-apk/KickoffManager-*.apk
          draft: false
          prerelease: false
          make_latest: true
