name: Release versi

# Rilis resmi: buat tag vX.Y.Z -> APK dibuild dan ditempel ke Release tersebut.
# Cara pakai:
#   git tag v1.0.1 && git push origin v1.0.1
# atau lewat tab Actions -> "Release versi" -> Run workflow (isi versi).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag versi (mis. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (split per ABI)
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1)
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          flutter build apk --release --split-per-abi \
            --dart-define=APP_VERSION="$VERSION" \
            --dart-define=APP_BUILD="$BUILD"
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi=$(echo "$f" | sed 's/app-\(.*\)-release.apk/\1/')
            mv "$f" "KickoffManager-${VERSION}-${abi}.apk"
          done
          ls -lh

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Kickoff Manager ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            APK Kickoff Manager ${{ github.event.inputs.tag || github.ref_name }}.

            | File | Perangkat |
            |---|---|
            | `*arm64-v8a.apk` | HP Android modern (disarankan) |
            | `*armeabi-v7a.apk` | HP lama 32-bit |
            | `*x86_64.apk` | Emulator |
          files: build/app/outputs/flutter-apk/KickoffManager-*.apk
          draft: false
          prerelease: false
          make_latest: true
